# Throwaway smoke test for the jammy-built arm64 CPU bundle. Not for merge.
# Downloads the app-*-linux-arm64-cpu artifact from a prebuilt run and runs it
# on ubuntu-22.04-arm (glibc 2.35), the host class the ubuntu-24.04-arm-built
# bundle failed to load on. Delete this branch after verification.

name: "tmp: smoke arm64 CPU bundle on jammy"

on:
  push:
    branches: [tmp-smoke-arm64-jammy]

env:
  # Actions run id holding the app-*-linux-arm64-cpu artifact.
  SOURCE_RUN_ID: "28913632512"

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Host glibc / libstdc++
        run: |
          set -eux
          ldd --version | head -1
          strings /usr/lib/aarch64-linux-gnu/libstdc++.so.6 | grep '^GLIBCXX_3.4.3' | sort -V | tail -1 || true

      - name: Download bundle artifact
        run: |
          set -eux
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "*linux-arm64-cpu*" --dir art
          mkdir -p bundle
          tar -xzf art/*/app-*-linux-arm64-cpu.tar.gz -C bundle

      - name: Loader check (the old failure mode)
        working-directory: bundle
        run: |
          set -eux
          ldd ./llama-server
          ./llama-server --version

      - name: Diagnostics (binary, backend loading)
        working-directory: bundle
        timeout-minutes: 6
        run: |
          set -x
          timeout 30 ./llama-cli --version; echo "cli-version-rc=$?"
          # --list-devices forces ggml_backend_load_all: dlopen + score of every
          # ggml-cpu variant .so. If this hangs, the problem is variant probing.
          timeout 60 ./llama-server --list-devices; echo "list-devices-rc=$?"
          true

      - name: End-to-end inference (tiny model)
        working-directory: bundle
        timeout-minutes: 10
        run: |
          set -x
          curl -sLo stories260K.gguf \
            https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
          ls -la stories260K.gguf && file stories260K.gguf
          if stdbuf -oL -eL timeout 120 ./llama-cli -m stories260K.gguf \
              -p "Once upon a time" -n 16 --no-warmup -no-cnv < /dev/null \
              > out.log 2> err.log; then
            echo "=== inference OK (all variants present) ==="
          else
            echo "=== inference FAILED rc=$? with all variants; err.log tail: ==="
            tail -30 err.log; wc -c err.log out.log
            echo "=== retry without the armv9.2 (SME) variants ==="
            mkdir -p quarantined && mv libggml-cpu-armv9.2*.so quarantined/
            stdbuf -oL -eL timeout 120 ./llama-cli -m stories260K.gguf \
              -p "Once upon a time" -n 16 --no-warmup -no-cnv < /dev/null \
              > out.log 2> err.log \
              || { echo "still failing rc=$?"; tail -30 err.log; exit 1; }
            echo "=== inference OK without SME variants -> armv9.2 variant is the hang ==="
          fi
          cat out.log
          test -s out.log
